name: Music Atlas Integrity

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build_atlas.js --check
      - run: node scripts/check_music_atlas.cjs
      - run: node scripts/stage_music_atlas.cjs
